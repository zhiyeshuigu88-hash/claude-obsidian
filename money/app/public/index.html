<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c8599" />
  <title>家計 — 今日つかえる額</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app" aria-live="polite">
    <p class="loading">読み込み中…</p>
  </main>

  <!-- 支出入力（フェーズ1の中心。§3 シーンA: 3タップで入力完了） -->
  <button id="fab" class="fab" hidden aria-label="支出を入力">＋</button>

  <dialog id="entry-dialog">
    <form id="entry-form" method="dialog">
      <header class="dialog-head">
        <h2>支出を入力</h2>
        <button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button>
      </header>

      <label class="field amount-field">
        <span>金額 <em>必須</em></span>
        <div class="amount-input">
          <span class="yen">¥</span>
          <input id="amount" name="amount" inputmode="numeric" pattern="[0-9]*"
                 autocomplete="off" placeholder="0" required />
        </div>
      </label>

      <div class="quick-amounts" id="quick-amounts"></div>

      <fieldset class="field">
        <legend>カテゴリ <em>任意</em></legend>
        <div class="chips" id="category-chips"></div>
      </fieldset>

      <label class="field">
        <span>日付</span>
        <input id="spentOn" name="spentOn" type="date" required />
      </label>

      <label class="field">
        <span>店名 <em>任意</em></span>
        <input id="storeName" name="storeName" autocomplete="off" placeholder="スーパー〇〇" />
      </label>

      <label class="field">
        <span>メモ <em>任意</em></span>
        <input id="memo" name="memo" autocomplete="off" placeholder="昼食" />
      </label>

      <p class="form-error" id="entry-error" hidden></p>

      <footer class="dialog-foot">
        <button type="submit" class="primary" id="entry-submit">保存</button>
      </footer>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <header class="dialog-head">
        <h2>予算の設定</h2>
        <button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button>
      </header>

      <label class="field">
        <span>期間予算（1期間ぶん・固定費こみ）</span>
        <div class="amount-input">
          <span class="yen">¥</span>
          <input id="periodBudget" name="periodBudget" inputmode="numeric" placeholder="0" />
        </div>
      </label>

      <label class="field">
        <span>固定費の合計（当面は手入力・自動計上はフェーズ2）</span>
        <div class="amount-input">
          <span class="yen">¥</span>
          <input id="fixedCostTotal" name="fixedCostTotal" inputmode="numeric" placeholder="0" />
        </div>
      </label>

      <p class="note">
        ※ 光熱費は含みません（要件定義書 v0.2 で管理対象外に決定）。
        予算はこのアプリで管理する支出ぶんだけを入れてください。
      </p>
      <p class="form-error" id="settings-error" hidden></p>

      <footer class="dialog-foot">
        <button type="submit" class="primary">保存</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
