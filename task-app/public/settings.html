<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定 | Focus Task</title>
  <script>
    try {
      var t = localStorage.getItem('taskapp.theme');
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pc.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#b96945" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Focus Task" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="nav-root"></aside>
    <main>
      <div class="content" style="max-width:480px;">
        <h1>設定</h1>
        <section class="card" style="margin-bottom:16px;">
          <div class="field">
            <label>表示テーマ</label>
            <div class="seg" id="theme-seg" role="radiogroup" aria-label="表示テーマ">
              <a href="#" class="seg-opt" data-theme-pref="light" role="radio">ライト</a>
              <a href="#" class="seg-opt" data-theme-pref="dark" role="radio">ダーク</a>
              <a href="#" class="seg-opt" data-theme-pref="system" role="radio">端末に合わせる</a>
            </div>
          </div>
        </section>
        <form id="settings-form" class="card">
          <div class="field"><label>作業時間（分）</label><input type="number" id="work-minutes" min="1" /></div>
          <div class="field"><label>休憩時間（分）</label><input type="number" id="break-minutes" min="1" /></div>
          <div style="display:flex;align-items:center;gap:12px;">
            <button type="submit" class="btn btn-primary">保存</button>
            <span id="saved-msg" class="tag tag-accent-2" style="display:none;">保存しました</span>
          </div>
        </form>
        <p class="text-muted" style="font-size:13px;margin-top:16px;">スマホでPC版の画面を開いている場合は、<a href="/m/index.html?ui=auto">スマホ版の画面に戻す</a>。</p>
      </div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
