<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>タスク | Focus Task</title>
  <script>
    try {
      var t = localStorage.getItem('taskapp.theme');
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/m.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#b96945" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Focus Task" />
</head>
<body class="m" data-tab="tasks">
  <div class="m-app">
    <header class="m-head"><h1>タスク</h1><span class="m-date" id="m-count"></span></header>
    <div class="m-filters" id="m-filters"></div>
    <div class="m-list" id="m-task-list"></div>
  </div>
  <button type="button" class="m-fab" id="m-add" aria-label="タスクを追加"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <nav class="m-tabbar" id="m-tabbar" aria-label="メインメニュー"></nav>

  <script src="/common.js"></script>
  <script src="/m-common.js"></script>
  <script src="/m-tasks.js"></script>
</body>
</html>
