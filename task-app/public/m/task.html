<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>タスク詳細 | Focus Task</title>
  <script>
    try {
      var t = localStorage.getItem('taskapp.theme');
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/m.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#b96945" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Focus Task" />
</head>
<body class="m" data-tab="tasks" data-home="tasks.html">
  <div class="m-app">
    <a href="tasks.html" class="btn btn-ghost m-back">← タスクに戻る</a>
    <div id="content"></div>
  </div>
  <nav class="m-tabbar" id="m-tabbar" aria-label="メインメニュー"></nav>

  <script src="/common.js"></script>
  <script src="/m-common.js"></script>
  <script src="/task-detail.js"></script>
</body>
</html>
