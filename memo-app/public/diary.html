<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日記 | Folio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f7f3ea">
  <script>
    // 描画前にテーマを適用して、ちらつきを防ぐ（保存した選択 → なければ端末の設定）
    (function () {
      var t = null;
      try { t = localStorage.getItem("folio.theme"); } catch (e) {}
      var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      var m = document.querySelector("meta[name=theme-color]");
      if (m) m.content = dark ? "#1d1a17" : "#f7f3ea";
    })();
  </script>
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Folio">
</head>
<body>
  <header class="site-header">
    <a class="back-link logo-link" href="/">‹ Folio</a>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="ダークモードに切り替え" title="ライト / ダークの切り替え">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        </button>
    </div>
  </header>

  <main class="focus-main">
    <div class="focus-date" id="diary-date-label"></div>
    <div class="focus-nav">
        <button type="button" id="diary-prev">‹ 前の日</button>
        <button type="button" id="diary-next">次の日 ›</button>
        <button type="button" id="diary-today">今日に戻る</button>
      </div>
    <div class="status" id="diary-status"></div>
    <hr>
    <textarea class="editor" id="diary-textarea" placeholder="今日の出来事、考えたこと、感じたことを書き留める"></textarea>
    <div class="diary-attach">
      <button type="button" id="diary-draw" class="secondary">✎ 手書きを追加</button>
    </div>
    <div class="hw-gallery" id="diary-images"></div>
    <div class="eyebrow written-title">書いた日</div>
    <div class="written" id="diary-list"></div>
  </main>

  <script src="handwriting.js"></script>
  <script src="app.js"></script>
</body>
</html>
